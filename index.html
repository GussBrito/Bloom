<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bloom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- =========================
             CABEÇALHO
        ========================== -->

        <header class="cabecalho">

            <div class="cabecalho-topo">
                <button
                    class="theme-toggle"
                    id="btnTema"
                    type="button"
                    title="Mudar paleta"
                    aria-label="Mudar paleta"
                >
                    <img src="favicons/cores.png" alt="Mudar paleta" class="tema-img" style="width: 42px; height: 42px; object-fit: contain;">
                </button>
            </div>

            <div class="decoracao-topo">
                ✿　♡　✿
            </div>

            <h1>Bloom</h1>

            <p>um cantinho para ouvir música</p>

        </header>


        <!-- =========================
             PLAYER
        ========================== -->

        <main class="player">

            <!-- Música atual -->

            <section class="musica-atual">

                <div class="capa" id="capa">

                    <div class="flor-capa">
                        ✿
                    </div>

                </div>


                <div class="informacoes">

                    <span class="pequeno-titulo">
                        tocando agora
                    </span>

                    <h2 id="tituloMusica">
                        Bloom
                    </h2>

                    <p id="nomeArquivo">
                        escolha uma música para começar
                    </p>

                </div>


                <!-- Favorito -->

                <button
                    class="favorito"
                    id="btnFavorito"
                    title="Favoritar"
                    aria-label="Favoritar música"
                >
                    <img class="small-icon" src="favicons/favoritar.png" alt="Favoritar">
                </button>

            </section>


            <!-- =========================
                 PROGRESSO
            ========================== -->

            <section class="progresso">

                <span id="tempoAtual">
                    0:00
                </span>


                <div
                    class="linha-progresso"
                    id="barraProgresso"
                >

                    <div
                        class="progresso-preenchido"
                        id="progressoPreenchido"
                    ></div>

                </div>


                <span id="duracao">
                    0:00
                </span>

            </section>


            <!-- =========================
                 CONTROLES PRINCIPAIS
            ========================== -->

            <section class="controles-principais">

                <button
                    class="controle"
                    id="btnAnterior"
                    title="Faixa anterior"
                    aria-label="Faixa anterior"
                >
                    <div class="icone floral-butterfly">
                        <img class="control-img" src="favicons/prev song.png" alt="Anterior">
                    </div>
                </button>

                <button
                    class="controle controle-play"
                    id="btnPlay"
                    title="Reproduzir ou pausar"
                    aria-label="Reproduzir ou pausar"
                >
                    <div class="play-visual" aria-hidden="true">
                        <span class="flor-aberta">✿</span>
                        <span class="continuidade">
                            <span class="continuidade-botao"></span>
                            <span class="continuidade-botao"></span>
                        </span>
                    </div>
                </button>

                <button
                    class="controle"
                    id="btnProxima"
                    title="Próxima faixa"
                    aria-label="Próxima faixa"
                >
                    <div class="icone butterfly-next">
                        <img class="control-img" src="favicons/next song.png" alt="Próxima">
                    </div>
                </button>

            </section>


            <!-- =========================
                 CONTROLES SECUNDÁRIOS
            ========================== -->

            <section class="controles-secundarios">

                <!-- SHUFFLE -->

                <button
                    class="controle-pequeno"
                    id="btnShuffle"
                    title="Aleatório"
                    aria-label="Modo aleatório"
                >

                    <div class="icone-pequeno flores">
                        <img class="small-icon" src="favicons/shuffle.png" alt="Aleatório">
                    </div>

                </button>


                <!-- VOLUME -->

                <div class="volume">

                    <div class="icone-volume" aria-label="Volume" title="Volume">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <input
                        type="range"
                        id="volume"
                        min="0"
                        max="1"
                        step="0.01"
                        value="0.75"
                    >

                </div>

                <button
                    class="controle-pequeno"
                    id="btnVoltar"
                    title="Voltar 10 segundos"
                    aria-label="Voltar 10 segundos"
                >
                    <div class="icone-pequeno flor-voltar">
                        <img class="small-icon" src="favicons/prev song.png" alt="Voltar 10 segundos">
                    </div>
                </button>

                <!-- REPETIR -->

                <button
                    class="controle-pequeno"
                    id="btnRepeat"
                    title="Repetir"
                    aria-label="Repetir"
                >

                    <div class="icone-pequeno lua">
                        <img class="small-icon" src="favicons/repeat.png" alt="Repetir">
                    </div>

                </button>


                <!-- ADICIONAR MÚSICAS -->

                <button
                    class="controle-pequeno adicionar"
                    id="btnAdicionar"
                    title="Adicionar músicas"
                    aria-label="Adicionar músicas"
                >

                    <div class="icone-pequeno envelope" aria-hidden="true">
                        <img class="small-icon" src="favicons/adicionar musica.png" alt="Adicionar músicas" style="width: 38px; height: 38px; object-fit: contain;">
                    </div>

                </button>


                <input
                    type="file"
                    id="inputMusicas"
                    accept="audio/*"
                    multiple
                    hidden
                >

            </section>


            <!-- =========================
                 PLAYLIST
            ========================== -->

            <section class="playlist">

                <div class="playlist-cabecalho">

                    <div>

                        <span class="pequeno-titulo">
                            sua coleção
                        </span>

                        <h3>
                            Músicas
                        </h3>

                    </div>


                    <span class="florzinha" aria-label="Playlist">✿</span>

                </div>


                <div
                    class="lista-musicas"
                    id="listaMusicas"
                >

                    <div
                        class="playlist-vazia"
                        id="playlistVazia"
                    >

                        <span class="flor-vazia">
                            ✿
                        </span>

                        <p>
                            suas músicas aparecerão aqui
                        </p>

                    </div>

                </div>

            </section>

        </main>


        <footer>

            <span>
                Bloom
            </span>

            <span>
                ♡
            </span>

        </footer>

    </div>


    <!-- ÁUDIO -->

    <!-- NOTE: ícones ilustrados integrados aos botões (usar arquivos em /favicons/) -->

    <audio id="audio"></audio>


    <script src="script.js"></script>

</body>

</html>
